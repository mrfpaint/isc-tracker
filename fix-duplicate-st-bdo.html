<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ST/BDO Duplicate Fixer</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:820px;margin:30px auto;padding:0 16px;color:#1e293b}
  h2{margin-bottom:4px} .sub{color:#64748b;font-size:14px;margin-bottom:20px}
  table{border-collapse:collapse;width:100%;font-size:13px;margin:12px 0}
  th,td{border:1px solid #e2e8f0;padding:6px 8px;text-align:left}
  th{background:#f1f5f9}
  button{background:#dc2626;color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
  button:disabled{background:#94a3b8;cursor:default}
  .ok{color:#16a34a;font-weight:600} .err{color:#dc2626}
  #log{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px;font-size:12px;margin-top:14px}
</style>
</head>
<body>
<h2>ST/BDO Duplicate Fixer</h2>
<div class="sub">Finds emp numbers that exist as <b>Active</b> in both the STs and BDOs sheets.
"Deactivate BDO row" blanks the BDO row's username/password and sets status=Inactive, so login always resolves to the ST record (correct ISC mapping via stId).</div>
<div id="out">Loading…</div>
<div id="log"></div>
<script>
const WORKER='https://mrf-isc-tracker.jofran81.workers.dev';
const log=m=>document.getElementById('log').textContent+=m+'\n';

async function readSheet(name){
  const r=await fetch(WORKER+'/sheets/read?sheet='+encodeURIComponent(name));
  const d=await r.json();
  const rows=d.values||[]; if(rows.length<2) return [];
  const h=rows[0];
  return rows.slice(1).filter(r=>r.some(c=>c)).map(row=>{const o={};h.forEach((k,i)=>o[k]=row[i]??'');return o;});
}
const active=r=>String(r.status||'Active').toLowerCase()!=='inactive';

async function scan(){
  const [sts,bdos]=await Promise.all([readSheet('STs'),readSheet('BDOs')]);
  const stByUser={};
  sts.filter(active).forEach(s=>{const u=String(s.username||'').trim();if(u)stByUser[u]=s;});
  const dups=bdos.filter(b=>active(b)&&stByUser[String(b.username||'').trim()]);
  const out=document.getElementById('out');
  if(!dups.length){out.innerHTML='<p class="ok">✅ No active ST/BDO duplicates found.</p>';return;}
  out.innerHTML='<table><tr><th>Emp No</th><th>BDO row (name · id · region)</th><th>ST row (name · id · region)</th><th>Action</th></tr>'+
    dups.map(b=>{const s=stByUser[String(b.username).trim()];
      return `<tr><td>${b.username}</td><td>${b.name} · ${b.id} · ${b.region||''}</td><td>${s.name} · ${s.id} · ${s.region||''}</td>
      <td><button onclick="fix('${b.id}',this)">Deactivate BDO row</button></td></tr>`;}).join('')+'</table>';
}

async function fix(id,btn){
  btn.disabled=true;btn.textContent='Updating…';
  try{
    const r=await fetch(WORKER+'/sheets/update',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sheet:'BDOs',matchField:'id',matchVal:id,updates:{username:'',password:'',status:'Inactive',relievedDate:new Date().toISOString().slice(0,10)}})});
    const d=await r.json();
    if(d.error) throw new Error(d.error.message||JSON.stringify(d.error));
    btn.textContent='✅ Done';btn.style.background='#16a34a';
    log('Deactivated '+id);
  }catch(e){btn.disabled=false;btn.textContent='Retry';log('❌ '+id+': '+e.message);}
}
scan().catch(e=>{document.getElementById('out').innerHTML='<p class="err">Failed to load: '+e.message+'</p>';});
</script>
</body>
</html>
