const HEADERS = ["id", "name", "empNo", "email", "phone", "location", "region", "username", "password", "role", "status"];

let token=null;
function log(msg,type='info'){const el=document.getElementById('log');el.style.display='block';el.innerHTML+=`<div class="${type}">${msg}</div>`;el.scrollTop=el.scrollHeight;}
function setProgress(pct){document.getElementById('progress').style.display='block';document.getElementById('pbar').style.width=pct+'%';}
function colName(n){let s='';while(n>0){s=String.fromCharCode(64+(n%26||26))+s;n=Math.floor((n-1)/26);}return s;}

async function getToken(){
  const clientId=document.getElementById('clientId').value.trim();
  if(!clientId) throw new Error('Please enter OAuth Client ID');
  return new Promise((resolve,reject)=>{
    const client=google.accounts.oauth2.initTokenClient({
      client_id:clientId,scope:'https://www.googleapis.com/auth/spreadsheets',
      callback:(resp)=>{if(resp.error){reject(new Error(resp.error));return;}token=resp.access_token;resolve(token);}
    });
    client.requestAccessToken({prompt:'consent'});
  });
}

async function sheetReq(method,path,body=null){
  const sheetId=document.getElementById('sheetId').value.trim();
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}${path}`;
  const opts={method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const resp=await fetch(url,opts);
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||resp.status);}
  return resp.json();
}

async function clearSheet(){
  log('Clearing BDOs sheet...','info');
  const resp=await sheetReq('GET','/values/BDOs');
  const rows=resp.values||[[]];
  if(rows.length<=1){log('Already empty','ok');return;}
  await sheetReq('POST',`/values/${encodeURIComponent('BDOs!A2:'+colName(rows[0].length)+rows.length)}:clear`,{});
  log('Cleared '+(rows.length-1)+' rows','ok');
}

async function uploadBDOs(){
  log('Uploading '+BDOS.length+' BDOs...','info');
  const endCol=colName(HEADERS.length);
  await sheetReq('PUT',`/values/${encodeURIComponent('BDOs!A1:'+endCol+'1')}?valueInputOption=RAW`,{values:[HEADERS]});
  const rows=BDOS.map(b=>HEADERS.map(h=>String(b[h]||'')));
  await sheetReq('PUT',`/values/${encodeURIComponent('BDOs!A2:'+endCol+(rows.length+1))}?valueInputOption=RAW`,{values:rows});
  setProgress(100);
  log('✅ All '+BDOS.length+' BDOs uploaded!','ok');
  log('BDOs can now log in at mrfpaint.github.io/isc-tracker/ → BDO Login','info');
  log('Username = Emp No, Password = Emp No','info');
}

async function startUpload(doClear=false){
  if(!document.getElementById('sheetId').value.trim()){alert('Please enter Sheet ID');return;}
  document.querySelectorAll('.btn').forEach(b=>b.disabled=true);
  document.getElementById('log').innerHTML='';
  try{
    log('Opening Google sign-in...','info');
    await getToken(); log('Signed in!','ok'); setProgress(10);
    if(doClear) await clearSheet();
    setProgress(30);
    await uploadBDOs();
  }catch(e){log('Error: '+e.message,'err');}
  finally{document.querySelectorAll('.btn').forEach(b=>b.disabled=false);}
}
function clearAndUpload(){startUpload(true);}
window.onload=()=>{
  const cfg=JSON.parse(localStorage.getItem('isc_gs_config')||'{}');
  if(cfg.sheetId) document.getElementById('sheetId').value=cfg.sheetId;
  if(cfg.clientId) document.getElementById('clientId').value=cfg.clientId;
};
