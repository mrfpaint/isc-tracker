<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISC Bulk Upload</title>
<style>
  body{font-family:Arial,sans-serif;background:#f8f9fc;padding:24px;color:#1f2937;}
  .card{background:white;border-radius:16px;padding:28px;max-width:650px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.08);}
  h2{color:#C8102E;margin-bottom:4px;}
  .sub{color:#6b7280;font-size:13px;margin-bottom:24px;}
  .form-group{margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:#374151;margin-bottom:6px;}
  input{width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;box-sizing:border-box;}
  .btn{width:100%;padding:12px;background:#C8102E;color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .btn-outline{background:white;color:#C8102E;border:1.5px solid #C8102E;}
  #log{margin-top:20px;background:#1a1a2e;border-radius:10px;padding:16px;color:#a3e635;font-family:monospace;font-size:12px;max-height:400px;overflow-y:auto;display:none;}
  .ok{color:#a3e635;}.err{color:#f87171;}.info{color:#93c5fd;}
  .progress{background:#e5e7eb;border-radius:10px;height:8px;margin-top:12px;display:none;}
  .progress-bar{background:#C8102E;height:8px;border-radius:10px;width:0%;transition:width .3s;}
  .alert{padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;}
  .stat{display:inline-block;background:#f3f4f6;border-radius:8px;padding:8px 16px;margin:4px;font-size:13px;font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <h2>👥 ISC Bulk Upload</h2>
  <p class="sub">Uploads all 245 ISCs to the Google Sheet Users tab</p>
  
  <div class="alert">
    ℹ️ <strong>Note:</strong> ASM mapping is not included — ASMs can assign ISCs from the app. Username = Emp No, Password = Emp No.
  </div>

  <div style="margin-bottom:16px">
    <span class="stat">👥 245 ISCs</span>
    <span class="stat">🗺️ 10 Regions</span>
    <span class="stat">🔑 Username = Password = Emp No</span>
  </div>

  <div class="form-group">
    <label>Google Sheet ID *</label>
    <input type="text" id="sheetId" placeholder="From your Google Sheet URL">
  </div>
  <div class="form-group">
    <label>Google OAuth Client ID *</label>
    <input type="text" id="clientId" placeholder="xxxx.apps.googleusercontent.com">
  </div>

  <button class="btn" onclick="startUpload()">🚀 Sign in & Upload All 245 ISCs</button>
  <button class="btn btn-outline" onclick="clearAndUpload()" style="margin-top:8px">🗑️ Clear Users Sheet First, Then Upload</button>

  <div class="progress" id="progress"><div class="progress-bar" id="pbar"></div></div>
  <div id="log"></div>
</div>

const HEADERS = ["id", "name", "email", "phone", "asmId", "asmName", "asmEmail", "asmPhone", "stId", "stName", "bdoId", "bdoName", "region", "dealerCodes", "username", "password", "role", "status", "createdAt"];

let token = null;

function log(msg,type='info'){const el=document.getElementById('log');el.style.display='block';el.innerHTML+=`<div class="${type}">${msg}</div>`;el.scrollTop=el.scrollHeight;}
function setProgress(pct){document.getElementById('progress').style.display='block';document.getElementById('pbar').style.width=pct+'%';}

async function getToken(){
  const clientId=document.getElementById('clientId').value.trim();
  if(!clientId) throw new Error('Please enter OAuth Client ID');
  return new Promise((resolve,reject)=>{
    const client=google.accounts.oauth2.initTokenClient({
      client_id:clientId,
      scope:'https://www.googleapis.com/auth/spreadsheets',
      callback:(resp)=>{if(resp.error){reject(new Error(resp.error));return;}token=resp.access_token;resolve(token);}
    });
    client.requestAccessToken({prompt:'consent'});
  });
}

async function sheetReq(method,path,body=null){
  const sheetId=document.getElementById('sheetId').value.trim();
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}${path}`;
  const opts={method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const resp=await fetch(url,opts);
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||resp.status);}
  return resp.json();
}

function colName(n){let s='';while(n>0){s=String.fromCharCode(64+(n%26||26))+s;n=Math.floor((n-1)/26);}return s;}

async function clearSheet(){
  log('Clearing existing Users sheet...','info');
  const resp = await sheetReq('GET','/values/Users?majorDimension=ROWS');
  const rows = resp.values||[[]];
  if(rows.length<=1){log('Sheet already empty','ok');return;}
  const endCol=colName(rows[0].length);
  const range=`Users!A2:${endCol}${rows.length}`;
  await sheetReq('POST',`/values/${encodeURIComponent(range)}:clear`,{});
  log('Cleared '+( rows.length-1)+' existing rows','ok');
}

async function uploadISCs(){
  log('Uploading '+ISCS.length+' ISCs...','info');
  // Write headers first
  const endCol=colName(HEADERS.length);
  await sheetReq('PUT',`/values/${encodeURIComponent('Users!A1:'+endCol+'1')}?valueInputOption=RAW`,{values:[HEADERS]});
  log('Headers written','ok');
  
  // Build all rows
  const now = new Date().toISOString();
  const rows = ISCS.map(isc=>HEADERS.map(h=>{
    if(h==='createdAt') return now;
    return String(isc[h]||'');
  }));
  
  // Upload in batches of 50
  const BATCH=50;
  for(let i=0;i<rows.length;i+=BATCH){
    const batch=rows.slice(i,i+BATCH);
    const startRow=i+2;
    const endRow=startRow+batch.length-1;
    const range=`Users!A${startRow}:${endCol}${endRow}`;
    await sheetReq('PUT',`/values/${encodeURIComponent(range)}?valueInputOption=RAW`,{values:batch});
    const pct=Math.round(((i+batch.length)/rows.length)*100);
    setProgress(pct);
    log(`Uploaded ${Math.min(i+BATCH,rows.length)}/${rows.length} ISCs...`,'info');
  }
  log('✅ All '+ISCS.length+' ISCs uploaded successfully!','ok');
}

async function startUpload(doClear=false){
  if(!document.getElementById('sheetId').value.trim()){alert('Please enter Sheet ID');return;}
  document.querySelectorAll('.btn').forEach(b=>b.disabled=true);
  document.getElementById('log').innerHTML='';
  try{
    log('Opening Google sign-in...','info');
    await getToken();
    log('Signed in!','ok');
    setProgress(5);
    if(doClear) await clearSheet();
    await uploadISCs();
    setProgress(100);
    log('','info');
    log('🎉 Done! Go back to ISC Tracker app and test ISC login.','ok');
    log('Try logging in with: username=611257, password=611257','info');
  }catch(e){log('Error: '+e.message,'err');}
  finally{document.querySelectorAll('.btn').forEach(b=>b.disabled=false);}
}

function clearAndUpload(){startUpload(true);}

// Pre-fill from ISC tracker config
window.onload=()=>{
  const cfg=JSON.parse(localStorage.getItem('isc_gs_config')||'{}');
  if(cfg.sheetId) document.getElementById('sheetId').value=cfg.sheetId;
  if(cfg.clientId) document.getElementById('clientId').value=cfg.clientId;
};
