let msalApp = null;
let token = null;

function log(msg, type='info') {
  const el = document.getElementById('log');
  el.style.display = 'block';
  const cls = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : 'log-info';
  el.innerHTML += '<div class="' + cls + '">' + msg + '</div>';
  el.scrollTop = el.scrollHeight;
}

function setProgress(pct) {
  document.getElementById('progress').style.display = 'block';
  document.getElementById('progress-bar').style.width = pct + '%';
}

async function getToken() {
  const tenantId = document.getElementById('tenantId').value.trim();
  const clientId = document.getElementById('clientId').value.trim();
  if (!tenantId || !clientId) throw new Error('Please fill in Tenant ID and Client ID');
  
  if (!msalApp) {
    msalApp = await msal.PublicClientApplication.createPublicClientApplication({
      auth: {
        clientId,
        authority: 'https://login.microsoftonline.com/' + tenantId,
        redirectUri: 'https://mrfpaint.github.io/isc-tracker/'
      },
      cache: { cacheLocation: 'localStorage' }
    });
  }

  const scopes = ['https://graph.microsoft.com/Files.ReadWrite.All', 'User.Read'];
  const accounts = msalApp.getAllAccounts();
  if (accounts.length > 0) {
    try {
      const r = await msalApp.acquireTokenSilent({ scopes, account: accounts[0] });
      return r.accessToken;
    } catch(e) {}
  }
  const r = await msalApp.loginPopup({ scopes });
  return r.accessToken;
}

async function findFile() {
  const filename = document.getElementById('filename').value.trim();
  const resp = await fetch(
    'https://graph.microsoft.com/v1.0/me/drive/root/search(q=\'' + encodeURIComponent(filename) + '\')',
    { headers: { Authorization: 'Bearer ' + token } }
  );
  const data = await resp.json();
  const file = data.value?.find(f => f.name === filename);
  if (!file) {
    // Also try Documents folder directly
    const resp2 = await fetch(
      'https://graph.microsoft.com/v1.0/me/drive/root:/Documents/' + encodeURIComponent(filename) + ':',
      { headers: { Authorization: 'Bearer ' + token } }
    );
    if (resp2.ok) {
      const file2 = await resp2.json();
      if (file2.id) return file2.id;
    }
    throw new Error('File "' + filename + '" not found in OneDrive. Please create it first by clicking Test Connection in the ISC Tracker app.');
  }
  return file.id;
}

async function clearASMSheet(fileId) {
  log('🗑️ Clearing existing ASMs sheet...');
  // Read current sheet to get dimensions
  const resp = await fetch(
    'https://graph.microsoft.com/v1.0/me/drive/items/' + fileId + '/workbook/worksheets/ASMs/usedRange',
    { headers: { Authorization: 'Bearer ' + token } }
  );
  const data = await resp.json();
  const rows = data.values || [[]];
  if (rows.length <= 1) { log('✅ Sheet already empty (only headers)', 'ok'); return; }
  
  // Clear all rows except header (row 1)
  const endCol = String.fromCharCode(64 + rows[0].length);
  const range = 'A2:' + endCol + rows.length;
  const clearResp = await fetch(
    'https://graph.microsoft.com/v1.0/me/drive/items/' + fileId + '/workbook/worksheets/ASMs/range(address=\'' + range + '\')/clear',
    { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ applyTo: 'Contents' }) }
  );
  if (!clearResp.ok) {
    log('⚠️ Clear failed, will overwrite anyway', 'err');
  } else {
    log('✅ Existing data cleared', 'ok');
  }
}

async function uploadASMs(fileId, doClear) {
  if (doClear) await clearASMSheet(fileId);

  log('📝 Writing ' + ASMS.length + ' ASMs to Excel...');
  
  // Write all rows at once as a batch
  const headers = ['id','name','email','phone','username','password'];
  const values = ASMS.map(a => [a.id, a.name, a.email, a.phone, a.username, a.password]);
  const allRows = [headers, ...values];
  const endCol = String.fromCharCode(64 + headers.length);
  const range = 'A1:' + endCol + allRows.length;

  setProgress(50);
  const writeResp = await fetch(
    'https://graph.microsoft.com/v1.0/me/drive/items/' + fileId + '/workbook/worksheets/ASMs/range(address=\'' + range + '\')',
    {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: allRows })
    }
  );
  
  if (!writeResp.ok) {
    const err = await writeResp.json();
    throw new Error('Write failed: ' + (err?.error?.message || writeResp.status));
  }
  
  setProgress(100);
  log('✅ All ' + ASMS.length + ' ASMs written successfully!', 'ok');
  log('', 'info');
  log('🎉 Done! Go back to your ISC Tracker app and refresh the Admin Panel.', 'ok');
}

async function startUpload(doClear = false) {
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  document.getElementById('log').innerHTML = '';
  try {
    log('🔐 Opening Microsoft login...');
    token = await getToken();
    log('✅ Signed in successfully!', 'ok');
    setProgress(20);
    log('🔍 Finding Excel file on OneDrive...');
    const fileId = await findFile();
    log('✅ File found!', 'ok');
    setProgress(30);
    await uploadASMs(fileId, doClear);
  } catch(e) {
    log('❌ Error: ' + e.message, 'err');
  } finally {
    document.querySelectorAll('.btn').forEach(b => b.disabled = false);
  }
}

async function clearSheet() {
  await startUpload(true);
}

// Pre-fill from localStorage if available
window.onload = () => {
  const cfg = JSON.parse(localStorage.getItem('isc_od_config') || '{}');
  if (cfg.tenantId) document.getElementById('tenantId').value = cfg.tenantId;
  if (cfg.clientId) document.getElementById('clientId').value = cfg.clientId;
  if (cfg.filename) document.getElementById('filename').value = cfg.filename;
};
